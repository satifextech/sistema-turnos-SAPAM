<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mesa de atención</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial, sans-serif;
    background:#f4f1f2;
    color:#252525;
}

.encabezado{
    min-height:100px;
    padding:20px 32px;
    background:#6A0F20;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    box-shadow:0 5px 18px rgba(0,0,0,0.25);
}

.encabezado h1{
    margin:0;
    font-size:34px;
}

.encabezado p{
    margin:7px 0 0;
    opacity:0.85;
}

.estado-conexion{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:bold;
}

.indicador{
    width:13px;
    height:13px;
    border-radius:50%;
    background:#29a453;
    box-shadow:0 0 10px rgba(41,164,83,0.7);
}

.indicador.desconectado{
    background:#c52b35;
    box-shadow:0 0 10px rgba(197,43,53,0.7);
}

.contenido{
    min-height:calc(100vh - 100px);
    padding:32px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.panel-mesa{
    width:min(760px, 100%);
    background:white;
    border-radius:24px;
    padding:36px;
    text-align:center;
    box-shadow:0 10px 35px rgba(0,0,0,0.13);
    border-top:7px solid #6A0F20;
}

.estado-titulo{
    color:#777;
    font-size:17px;
    font-weight:bold;
    letter-spacing:1px;
    text-transform:uppercase;
}

.turno-actual{
    min-height:190px;
    margin:20px 0 28px;
    padding:25px;
    border-radius:18px;
    background:#f8f5f6;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    border:2px solid #eadfe2;
}

#resultado{
    color:#6A0F20;
    font-size:68px;
    line-height:1;
    font-weight:bold;
}

.mensaje-secundario{
    margin-top:14px;
    color:#747474;
    font-size:16px;
}

.acciones{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:16px;
}

button{
    min-height:62px;
    border:none;
    border-radius:14px;
    padding:15px 20px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
}

button:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 7px 17px rgba(0,0,0,0.18);
}

button:disabled{
    cursor:not-allowed;
    opacity:1;
    background:#c7c7c7;
    color:#686868;
    box-shadow:none;
    transform:none;
}

.boton-llamar{
    background:#6A0F20;
    color:white;
}

.boton-rellamar{
    background:#2874a6;
    color:white;
}

.boton-finalizar{
    background:#d79a16;
    color:white;
}

.aviso{
    min-height:25px;
    margin-top:22px;
    color:#666;
    font-size:15px;
}

.aviso.error{
    color:#ba2432;
    font-weight:bold;
}

.aviso.exito{
    color:#218342;
    font-weight:bold;
}

.boton-pausa{
    background:#555;
    color:white;
}

.boton-disponible{
    background:#218342;
    color:white;
}

@media(max-width:650px){

    .encabezado{
        align-items:flex-start;
        flex-direction:column;
    }

    .contenido{
        padding:18px;
    }

    .panel-mesa{
        padding:24px 18px;
    }

    .acciones{
        grid-template-columns:1fr;
    }

    #resultado{
        font-size:50px;
    }

}

</style>
</head>

<body>

<header class="encabezado">

    <div>
        <h1 id="tituloMesa">Mesa</h1>
        <p>Sistema de Gestión de Turnos SAPAM</p>
    </div>

    <div class="estado-conexion">
        <span
            class="indicador"
            id="indicadorConexion">
        </span>

        <span id="textoConexion">
            Conectando con el servidor...
        </span>
    </div>

</header>

<main class="contenido">

    <section class="panel-mesa">

        <div class="estado-titulo">
            Turno en atención
        </div>

        <div class="turno-actual">

            <div id="resultado">
                Cargando...
            </div>

            <div class="mensaje-secundario" id="mensajeEstado">
                Consultando estado de la mesa
            </div>

        </div>

        <div class="acciones">

            <button
                id="btnLlamar"
                class="boton-llamar"
                onclick="llamar()">

                Llamar siguiente turno

            </button>

            <button
                id="btnRellamar"
                class="boton-rellamar"
                onclick="rellamar()"
                disabled>

                Volver a llamar

            </button>

            <button
                id="btnFinalizar"
                class="boton-finalizar"
                onclick="finalizar()"
                disabled>

                Finalizar atención

            </button>

            <button
                id="btnDescanso"
                class="boton-pausa"
                onclick="cambiarEstadoMesa('pausa', 'Descanso')">

                Descanso

            </button>

            <button
                id="btnBano"
                class="boton-pausa"
                onclick="cambiarEstadoMesa('pausa', 'Baño')">

                Baño

            </button>

            <button
                id="btnComida"
                class="boton-pausa"
                onclick="cambiarEstadoMesa('pausa', 'Comida')">

                Comida

            </button>

            <button
                id="btnDisponible"
                class="boton-disponible"
                onclick="cambiarEstadoMesa('disponible', null)"
                disabled>

                Marcar disponible

            </button>

        </div>

        <div class="aviso" id="aviso"></div>

    </section>

</main>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const numeroMesa =
    Number(
        window.location.pathname
            .split("/")
            .pop()
    );

let turnoActual = null;
let nombreMesa =
    `Mesa ${numeroMesa}`;

async function cargarConfiguracionMesa(){

    try{

        const response =
            await fetch(
                `/api/mesa/${numeroMesa}/config`,
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(!response.ok || !data.success){

            throw new Error(
                data.mensaje
                || "No se pudo cargar el punto de atención"
            );

        }

        nombreMesa =
            data.mesa.nombre
            || `Mesa ${numeroMesa}`;

        document.getElementById(
            "tituloMesa"
        ).textContent =
            nombreMesa;

        if(
            Number(data.mesa.activo) !== 1
            || Number(
                data.mesa.permiteTurnos
            ) !== 1
        ){

            aplicarEstadoOperativo(
                "deshabilitada",
                "Punto de atención deshabilitado"
            );

        }

    }catch(error){

        console.error(
            "Error al cargar configuración:",
            error
        );

        document.getElementById(
            "tituloMesa"
        ).textContent =
            `Punto ${numeroMesa}`;

        mostrarAviso(
            error.message,
            "error"
        );

        btnLlamar.disabled = true;

    }

}

const resultado =
    document.getElementById("resultado");

const mensajeEstado =
    document.getElementById("mensajeEstado");

const aviso =
    document.getElementById("aviso");

const btnLlamar =
    document.getElementById("btnLlamar");

const btnRellamar =
    document.getElementById(
        "btnRellamar"
);

const btnFinalizar =
    document.getElementById("btnFinalizar");

const btnDescanso =
    document.getElementById(
        "btnDescanso"
    );

const btnBano =
    document.getElementById(
        "btnBano"
    );

const btnComida =
    document.getElementById(
        "btnComida"
    );

const btnDisponible =
    document.getElementById(
        "btnDisponible"
    );

const indicadorConexion =
    document.getElementById(
        "indicadorConexion"
    );

const textoConexion =
    document.getElementById(
        "textoConexion"
    );

let servidorConectado = false;
let operacionMesaEnProceso = false;

let ultimoRellamadoSolicitado =
    0;

const DURACION_BLOQUEO_RELLAMADO =
    8000;

function bloquearControlesMesa(){

    btnLlamar.disabled = true;
    btnRellamar.disabled = true;
    btnFinalizar.disabled = true;
    btnDescanso.disabled = true;
    btnBano.disabled = true;
    btnComida.disabled = true;
    btnDisponible.disabled = true;

}


function actualizarConexionMesa(conectado){

    servidorConectado =
        conectado;

    if(conectado){

        indicadorConexion.className =
            "indicador";

        textoConexion.textContent =
            "Servidor conectado";

        mostrarAviso(
            "Conexión restablecida.",
            "exito"
        );

        cargarTurnoActual();
        cargarEstadoOperativo();

        return;

    }

    indicadorConexion.className =
        "indicador desconectado";

    textoConexion.textContent =
        "Servidor desconectado";

    bloquearControlesMesa();

    mostrarAviso(
        "Se perdió la conexión con el servidor.",
        "error"
    );

}

socket.on("connect", ()=>{

    actualizarConexionMesa(true);

});


socket.on("disconnect", ()=>{

    actualizarConexionMesa(false);

});


socket.on("connect_error", error => {

    console.error(
        "Error de conexión Socket.IO:",
        error
    );

    actualizarConexionMesa(false);

});


function mostrarAviso(mensaje, tipo = ""){

    aviso.textContent = mensaje;
    aviso.className = "aviso";

    if(tipo){
        aviso.classList.add(tipo);
    }

}

function actualizarBotonesMesa(){

    const atendiendo =
        Boolean(
            turnoActual
        );

    /*
    Durante una atención no se puede solicitar:
    descanso, baño o comida.
    */
    btnDescanso.disabled =
        atendiendo;

    btnBano.disabled =
        atendiendo;

    btnComida.disabled =
        atendiendo;

    /*
    Llamar solamente cuando no existe
    un turno en atención.
    */
    btnLlamar.disabled =
        atendiendo;

    /*
    Volver a llamar y finalizar solamente
    cuando existe un turno activo.
    */
    btnRellamar.disabled =
        !atendiendo;

    btnFinalizar.disabled =
        !atendiendo;

}


function mostrarMesaLibre(
    mensaje = "Mesa disponible"
){

    turnoActual = null;

    resultado.textContent =
        "MESA LIBRE";

    mensajeEstado.textContent =
        mensaje;

    actualizarBotonesMesa();

}


function mostrarTurno(turno){

    turnoActual =
        turno.id;

    resultado.textContent =
        turno.codigo;

    mensajeEstado.textContent =
        "Atención en proceso";

    actualizarBotonesMesa();

    mostrarAviso(
        "Finaliza la atención para habilitar Descanso, Baño o Comida."
    );

}


async function cargarTurnoActual(){

    try{

        const response =
            await fetch(
                `/api/mesa/${numeroMesa}/actual`,
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(data.success && data.turno){

            mostrarTurno(data.turno);

        }else{

            mostrarMesaLibre();

        }

    }catch(error){

        console.error(
            "Error al cargar la mesa:",
            error
        );

        mostrarMesaLibre(
            "No se pudo consultar el estado"
        );

        mostrarAviso(
            "Error al conectar con el servidor",
            "error"
        );

    }

}


async function llamar(){

    if(
        operacionMesaEnProceso
        || !servidorConectado
    ){

        return;

    }

    operacionMesaEnProceso = true;

    if(turnoActual){

        operacionMesaEnProceso = false;

        mostrarAviso(
            "Primero debes finalizar el turno actual.",
            "error"
        );

        actualizarBotonesMesa();

        return;

    }

    btnLlamar.disabled = true;
    btnLlamar.textContent =
        "Buscando turno...";

    mostrarAviso("");

    try{

        const response =
            await fetch("/api/llamar", {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    mesa:numeroMesa
                })

            });

        const data =
            await response.json();

        if(!response.ok || !data.success){

            if(
                data.mensaje === "Sin turnos"
                || response.status === 404
            ){

                mostrarMesaLibre(
                    "No hay turnos pendientes"
                );

                mostrarAviso(
                    "No hay turnos disponibles.",
                    "error"
                );

                return;

            }

            throw new Error(
                data.mensaje
                || "No se pudo llamar el turno"
            );

        }

        mostrarTurno({
            id:data.id,
            codigo:data.codigo
        });

        mostrarAviso(
            `Turno ${data.codigo} llamado correctamente.`,
            "exito"
        );

    }catch(error){

        console.error(
            "Error al llamar turno:",
            error
        );

        mostrarAviso(
            error.message,
            "error"
        );

        if(!turnoActual){
            mostrarMesaLibre();
        }

    }finally{

        operacionMesaEnProceso = false;

        btnLlamar.textContent =
            "Llamar siguiente turno";

        actualizarBotonesMesa();

    }

}

/*
=========================================================
VOLVER A LLAMAR EL TURNO ACTUAL
=========================================================
*/

/*
=========================================================
VOLVER A LLAMAR EL TURNO ACTUAL
=========================================================
*/

async function rellamar(){

    if(
        operacionMesaEnProceso
        || !servidorConectado
    ){

        return;

    }

    if(!turnoActual){

        mostrarMesaLibre();

        mostrarAviso(
            "No existe un turno activo para volver a llamar.",
            "error"
        );

        return;

    }

    const ahora =
        Date.now();

    const tiempoTranscurrido =
        ahora
        - ultimoRellamadoSolicitado;

    if(
        tiempoTranscurrido
        < DURACION_BLOQUEO_RELLAMADO
    ){

        const segundosRestantes =
            Math.ceil(
                (
                    DURACION_BLOQUEO_RELLAMADO
                    - tiempoTranscurrido
                )
                / 1000
            );

        mostrarAviso(
            `El turno ya se está anunciando. Espera ${segundosRestantes} segundos.`,
            "error"
        );

        return;

    }

    /*
    El bloqueo se activa antes del fetch.

    De esta forma, un segundo clic inmediato
    no puede iniciar otra solicitud.
    */
    operacionMesaEnProceso =
        true;

    ultimoRellamadoSolicitado =
        ahora;

    btnRellamar.disabled =
        true;

    btnRellamar.textContent =
        "Anunciando turno...";

    mostrarAviso("");

    try{

        const response =
            await fetch(
                "/api/repetir-llamado",
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            mesa:
                                numeroMesa
                        })

                }
            );

        const data =
            await response.json();

        if(!response.ok || !data.success){

            if(response.status === 404){

                mostrarMesaLibre(
                    "El turno ya no se encuentra activo"
                );

            }

            throw new Error(
                data.mensaje
                || "No se pudo volver a llamar el turno"
            );

        }

        mostrarAviso(
            `Turno ${data.codigo} vuelto a llamar correctamente.`,
            "exito"
        );

        /*
        Mantenemos visualmente bloqueado el botón
        durante el tiempo que dura el anuncio.
        */
        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    DURACION_BLOQUEO_RELLAMADO
                )
        );

    }catch(error){

        console.error(
            "Error al volver a llamar turno:",
            error
        );

        mostrarAviso(
            error.message,
            "error"
        );

        /*
        Si la petición ni siquiera fue aceptada,
        permitimos volver a intentarlo después
        de revisar el error.
        */
        if(
            error.message
                .includes(
                    "No se pudo volver a llamar"
                )
        ){

            ultimoRellamadoSolicitado =
                0;

        }

    }finally{

        operacionMesaEnProceso =
            false;

        btnRellamar.textContent =
            "Volver a llamar";

        actualizarBotonesMesa();

    }

}

async function finalizar(){

    if(
        operacionMesaEnProceso
        || !servidorConectado
    ){

        return;

    }

    operacionMesaEnProceso = true;

    if(!turnoActual){

        operacionMesaEnProceso = false;

        mostrarMesaLibre();

        mostrarAviso(
            "La mesa ya se encuentra libre.",
            "error"
        );

        return;

    }

    btnFinalizar.disabled = true;
    btnFinalizar.textContent =
        "Finalizando...";

    mostrarAviso("");

    try{

        const response =
            await fetch("/api/finalizar", {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    id:turnoActual
                })

            });

        const data =
            await response.json();

        /*
        Si Admin ya liberó la mesa, el backend responde 404.
        Para la interfaz eso también significa que ya está libre.
        */
        if(response.status === 404){

            mostrarMesaLibre(
                "La mesa fue liberada desde Administración"
            );

            mostrarAviso(
                "La mesa ya estaba liberada.",
                "exito"
            );

            return;

        }

        if(!response.ok || !data.success){

            throw new Error(
                data.mensaje
                || "No se pudo finalizar"
            );

        }

        mostrarMesaLibre(
            "Atención finalizada correctamente"
        );

        mostrarAviso(
            "Turno finalizado.",
            "exito"
        );

    }catch(error){

        console.error(
            "Error al finalizar:",
            error
        );

        mostrarAviso(
            error.message,
            "error"
        );

        actualizarBotonesMesa();

    }finally{

        operacionMesaEnProceso = false;

        btnFinalizar.textContent =
            "Finalizar atención";

        actualizarBotonesMesa();

    }

}


/*
Cuando Admin libera todas las mesas,
la pantalla se limpia inmediatamente.
*/
socket.on("mesasLiberadas", ()=>{

    mostrarMesaLibre(
        "Mesa liberada desde Administración"
    );

    mostrarAviso(
        "La mesa fue liberada por el administrador.",
        "exito"
    );

});


/*
Si el mismo turno fue finalizado desde otro punto,
también se limpia esta mesa.
*/
socket.on("turnoFinalizado", (data)=>{

    if(
        turnoActual
        && Number(data.id) === Number(turnoActual)
    ){

        mostrarMesaLibre(
            "Atención finalizada"
        );

    }

});

socket.on("jornadaCerrada", ()=>{

    mostrarMesaLibre(
        "La jornada fue cerrada por Administración"
    );

    mostrarAviso(
        "Jornada finalizada.",
        "exito"
    );

});

function aplicarEstadoOperativo(
    estado,
    motivo = null
){

    const disponible =
        estado === "disponible";

    if(disponible){

        resultado.textContent =
            turnoActual
                ? resultado.textContent
                : "MESA LIBRE";

        mensajeEstado.textContent =
            turnoActual
                ? "Atención en proceso"
                : "Mesa disponible";

        /*
        Utiliza el estado real del turno
        para habilitar o bloquear botones.
        */
        actualizarBotonesMesa();

        /*
        Si está disponible, no necesita
        el botón Marcar disponible.
        */
        btnDisponible.disabled = true;

    }else{

        resultado.textContent =
            estado.toUpperCase();

        mensajeEstado.textContent =
            motivo
            || "Mesa no disponible";

        /*
        Mientras está en pausa, ausencia,
        vacaciones o deshabilitada no puede
        llamar ni finalizar turnos.
        */
        btnLlamar.disabled = true;
        btnRellamar.disabled = true;
        btnFinalizar.disabled = true;

        btnDescanso.disabled = true;
        btnBano.disabled = true;
        btnComida.disabled = true;

        /*
        Permite regresar a disponible.
        */
        btnDisponible.disabled = false;

    }

}

async function cambiarEstadoMesa(
    estado,
    motivo = null
){
    if(
        operacionMesaEnProceso
        || !servidorConectado
    ){

        return;

    }

    operacionMesaEnProceso = true;

    if(
        turnoActual
        && estado !== "disponible"
    ){

        operacionMesaEnProceso = false;

        mostrarAviso(
            "Primero finaliza el turno actual.",
            "error"
        );

        actualizarBotonesMesa();

        return;

    }

    try{

        const response =
            await fetch(
                `/api/mesa/${numeroMesa}/estado`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        estado,
                        motivo
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok || !data.success){

            throw new Error(
                data.mensaje
                || "No se pudo cambiar el estado"
            );

        }

        aplicarEstadoOperativo(
            estado,
            motivo
        );

        if(estado === "disponible"){

            mostrarAviso(
                "Mesa disponible para atender.",
                "exito"
            );

        }else{

            mostrarAviso(
                `Mesa en pausa: ${motivo}`,
                "exito"
            );

        }

    }catch(error){

        console.error(error);

        mostrarAviso(
            error.message,
            "error"
        );

    }finally{

        operacionMesaEnProceso = false;

        if(servidorConectado){

            await cargarEstadoOperativo();

        }

    }

}

async function cargarEstadoOperativo(){

    try{

        const response =
            await fetch(
                `/api/mesa/${numeroMesa}/estado`,
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(data.success){

            aplicarEstadoOperativo(
                data.mesa.estado,
                data.mesa.motivo
            );

        }

    }catch(error){

        console.error(
            "No se pudo cargar el estado:",
            error
        );

    }

}

async function iniciarMesa(){

    await cargarConfiguracionMesa();

    await cargarTurnoActual();

    await cargarEstadoOperativo();

}

socket.on(
    "estadoMesaActualizado",
    data => {

        if(
            Number(data.numero)
            !== numeroMesa
        ){
            return;
        }

        aplicarEstadoOperativo(
            data.estado,
            data.motivo
        );

    }
);

iniciarMesa();

</script>
