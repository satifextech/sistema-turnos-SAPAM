<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acceso SAPAM</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial, sans-serif;
    background:
        linear-gradient(
            135deg,
            #6A0F20,
            #8C1C32
        );
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
}

.login{
    width:min(430px, 100%);
    background:white;
    border-radius:24px;
    padding:34px;
    box-shadow:0 18px 50px rgba(0,0,0,0.3);
}

.logo{
    width:90px;
    height:90px;
    margin:0 auto 18px;
    padding:9px;
    border-radius:20px;
    background:#f5f1f2;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

h1{
    margin:0;
    color:#6A0F20;
    text-align:center;
    font-size:29px;
}

.subtitulo{
    margin:8px 0 25px;
    color:#777;
    text-align:center;
}

.campo{
    margin-bottom:17px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#555;
    font-weight:bold;
}

input{
    width:100%;
    min-height:49px;
    padding:11px 13px;
    border:1px solid #d9ced1;
    border-radius:11px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#8C1C32;
    box-shadow:0 0 0 3px rgba(140,28,50,0.12);
}

button{
    width:100%;
    min-height:52px;
    margin-top:8px;
    border:none;
    border-radius:12px;
    background:#6A0F20;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.mensaje{
    min-height:24px;
    margin-top:16px;
    color:#ba2835;
    text-align:center;
    font-weight:bold;
}

</style>
</head>

<body>

<section class="login">

    <div class="logo">
        <img
            src="/assets/iconos/sapam.png"
            alt="SAPAM">
    </div>

    <h1>Panel de Administración</h1>

    <p class="subtitulo">
        Inicia sesión para continuar
    </p>

    <form id="formLogin">

        <div class="campo">
            <label for="usuario">
                Usuario
            </label>

            <input
                id="usuario"
                name="usuario"
                autocomplete="username"
                required>
        </div>

        <div class="campo">
            <label for="contraseña">
                Contraseña
            </label>

            <input
                id="contraseña"
                name="contraseña"
                type="password"
                autocomplete="current-password"
                required>
        </div>

        <button id="btnEntrar" type="submit">
            Iniciar sesión
        </button>

        <div class="mensaje" id="mensaje"></div>

    </form>

</section>

<script>

const formulario =
    document.getElementById("formLogin");

const boton =
    document.getElementById("btnEntrar");

const mensaje =
    document.getElementById("mensaje");

function destinoPorRol(rol){

    if(rol === "recepcion"){
        return "/recepcion";
    }

    if(rol === "supervisor"){
        return "/admin";
    }

    return "/admin";

}

async function revisarSesion(){

    try{

        const response =
            await fetch("/api/sesion", {
                cache:"no-store"
            });

        if(response.ok){

            function destinoPorRol(rol){

                if(rol === "recepcion"){
                    return "/recepcion";
                }

                return "/admin";

            }

        }

    }catch(error){

        console.error(error);

    }

}

formulario.addEventListener(
    "submit",
    async evento => {

        evento.preventDefault();

        boton.disabled = true;
        boton.textContent =
            "Ingresando...";

        mensaje.textContent = "";

        try{

            const response =
                await fetch("/api/login", {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        usuario:
                            document.getElementById(
                                "usuario"
                            ).value,

                        contraseña:
                            document.getElementById(
                                "contraseña"
                            ).value

                    })

                });

            const data =
                await response.json();

            if(!response.ok || !data.success){

                window.location.href =
                    destinoPorRol(data.rol);

            }

            window.location.href =
                destinoPorRol(data.rol);

        }catch(error){

            mensaje.textContent =
                error.message;

        }finally{

            boton.disabled = false;
            boton.textContent =
                "Iniciar sesión";

        }

    }
);


revisarSesion();

</script>

</body>

</html>
