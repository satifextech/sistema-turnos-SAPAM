<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pantalla Turnos</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#6A0F20;
    color:#222;
    overflow:hidden;
}

.pantalla{
    width:100vw;
    height:100vh;
    display:grid;
    grid-template-rows:minmax(0, 74fr) minmax(0, 26fr);
    padding:18px;
    gap:18px;
    overflow:hidden;
}

.zona-superior{
    display:grid;
    grid-template-columns:minmax(0, 72fr) minmax(0, 28fr);
    gap:18px;
    min-width:0;
    min-height:0;
    overflow:hidden;
}

.panel-derecho{
    display:grid;
    grid-template-rows:minmax(0, 13fr) minmax(0, 64fr) minmax(0, 18fr);
    gap:14px;
    min-width:0;
    min-height:0;
    overflow:hidden;
}

.tarjeta{
    background:#fff;
    border-radius:22px;
    box-shadow:0 8px 25px rgba(0,0,0,0.28);
    overflow:hidden;
    min-width:0;
    min-height:0;
}

.reloj{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:#6A0F20;
}

#hora{
    font-size:42px;
    font-weight:bold;
}

#fecha{
    font-size:22px;
}

.ultimos{
    padding:18px;
    min-height:0;
    overflow:hidden;
}

.ultimos h2{
    margin:0 0 18px 0;
    text-align:center;
    font-size:30px;
    color:#6A0F20;
}

#lista{
    font-size:30px;
    line-height:1.45;
    text-align:center;
    font-weight:bold;
    max-height:calc(100% - 55px);
    overflow:hidden;
}

.logo-box{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:8px;
    min-height:0;
    overflow:hidden;
}

.logo-box img{
    display:block;
    width:auto;
    height:auto;
    max-width:88%;
    max-height:88%;
    object-fit:contain;
}

.zona-inferior{
    display:grid;
    grid-template-columns:minmax(0, 68fr) minmax(0, 32fr);
    gap:18px;
    min-width:0;
    min-height:0;
    overflow:hidden;
}

.turno-actual,
.mesa-actual{
    background:#fff;
    border-radius:26px;
    box-shadow:0 8px 25px rgba(0,0,0,0.35);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-width:0;
    min-height:0;
    overflow:hidden;
}

.titulo{
    font-size:26px;
    color:#6A0F20;
    font-weight:bold;
    letter-spacing:2px;
}

#turno,
#mesa{
    max-width:100%;
    white-space:nowrap;
    line-height:1;
}

#turno{
    font-size:85px;
    font-weight:bold;
    color:#8C1C32;
}

#mesa{
    font-size:75px;
    font-weight:bold;
    color:#8C1C32;
}

.resaltar{
    animation: brillo 1.2s ease;
}

@keyframes brillo{
    0%{
        outline:0 solid rgba(212,175,55,0);
        box-shadow:0 8px 25px rgba(0,0,0,0.35);
    }

    50%{
        outline:7px solid rgba(212,175,55,0.95);
        outline-offset:-7px;
        box-shadow:0 0 35px rgba(212,175,55,0.85);
    }

    100%{
        outline:0 solid rgba(212,175,55,0);
        box-shadow:0 8px 25px rgba(0,0,0,0.35);
    }
}

.video-box{
    position:relative;
    width:100%;
    height:100%;
    min-width:0;
    min-height:0;
    background:#111;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,0.35);
}

.video-box video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    max-width:100%;
    max-height:100%;
    object-fit:cover;
    display:block;
}

.video-box::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0);
    transition:background 0.4s ease;
    pointer-events:none;
}

.video-box.oscuro::after{
    background:rgba(0,0,0,0.55);
}

.overlay-turno{
    position:absolute;
    top:50%;
    left:50%;
    max-width:80%;
    max-height:80%;
    transform:
        translate(-50%, -50%)
        scale(0.85);
    background:rgba(106,15,32,0.95);
    color:white;
    border:4px solid #D4AF37;
    border-radius:28px;
    padding:35px 70px;
    text-align:center;
    opacity:0;
    z-index:5;
    box-shadow:
        0 0 45px
        rgba(212,175,55,0.75);
    transition:all 0.4s ease;
    pointer-events:none;
    overflow:hidden;
}

.overlay-turno.activo{
    opacity:1;
    transform:translate(-50%, -50%) scale(1);
}

.overlay-titulo{
    font-size:42px;
    letter-spacing:5px;
    font-weight:bold;
}

.overlay-codigo{
    font-size:120px;
    font-weight:bold;
    margin:10px 0;
}

.overlay-mesa{
    font-size:58px;
    font-weight:bold;
    white-space:nowrap;
}

.sin-videos-pantalla{
    position:absolute;
    inset:0;
    z-index:1;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:30px;
    background:
        linear-gradient(
            145deg,
            #6A0F20,
            #8C1C32
        );
    color:white;
    text-align:center;
}

.sin-videos-pantalla.activo{
    display:flex;
}

.sin-videos-pantalla img{
    width:min(280px, 55%);
    max-height:38%;
    object-fit:contain;
    filter:
        drop-shadow(
            0 8px 18px
            rgba(0,0,0,0.25)
        );
}

.sin-videos-pantalla strong{
    font-size:34px;
}

.sin-videos-pantalla span{
    font-size:20px;
    opacity:0.85;
}


</style>

</head>

<body>

<div class="pantalla">

    <div class="zona-superior">

        <div class="video-box" id="videoBox">

            <video
                id="videoPublicidad"
                autoplay
                playsinline>
            </video>

            <div
                class="sin-videos-pantalla"
                id="sinVideosPantalla">

                <img
                    src="/assets/iconos/sapam.png"
                    alt="SAPAM">

                <strong>
                    Sistema de Gestión de Turnos
                </strong>

                <span>
                    No hay videos activos para reproducir
                </span>

            </div>

            <div class="overlay-turno" id="overlayTurno">
                <div class="overlay-titulo">TURNO</div>
                <div class="overlay-codigo" id="overlayCodigo">---</div>
                <div class="overlay-mesa" id="overlayMesa">MESA ---</div>
            </div>

        </div>

        <div class="panel-derecho">

            <div class="tarjeta reloj">
                <div id="hora">--:--</div>
                <div id="fecha">--/--/----</div>
            </div>

            <div class="tarjeta ultimos">
                <h2>Últimos turnos</h2>
                <div id="lista"></div>
            </div>

            <div class="tarjeta logo-box">
                <img src="/assets/iconos/sapam.png" alt="SAPAM">
            </div>

        </div>

    </div>

    <div class="zona-inferior">

        <div class="turno-actual" id="tarjetaTurno">
            <div class="titulo">TURNO ACTUAL</div>
            <div id="turno">---</div>
        </div>

        <div class="mesa-actual" id="tarjetaMesa">
            <div class="titulo">MESA</div>
            <div id="mesa">---</div>
        </div>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const lista = [];

let configuracionMultimedia = {

    volumenVoz:100,

    volumenVideo:35,

    vozSilenciada:false,

    videoSilenciado:false

};

let videoReducidoPorAnuncio = false;

const sonido = new Audio("/assets/sonidos/ding.mp3");

sonido.volume =
    configuracionMultimedia
        .volumenVoz
    / 100;

document.addEventListener(
    "click",
    ()=>{

        sonido.play()
            .then(()=>{

                sonido.pause();

                sonido.currentTime = 0;

            })
            .catch(()=>{});

        aplicarVolumenVideo();

        aplicarVolumenVoz();

        reproductor
            .play()
            .catch(()=>{});

    },
    {
        once:true
    }
);

const colaAnuncios = [];
let anunciando = false;

function obtenerPrefijo(codigo){

    const coincidencia =
        String(codigo || "")
            .match(/^[A-Za-z]+/);

    return coincidencia
        ? coincidencia[0].toUpperCase()
        : "";

}

function formatearPrefijo(prefijo){

    return prefijo.split("").join(" ");

}

function obtenerNumeroTurno(codigo){

    const prefijo = obtenerPrefijo(codigo);

    return codigo.replace(prefijo, "");

}

function formatearNumero(numero){

    return numero.split("").join(" ");

}

function hablar(texto){

    return new Promise(
        (resolve)=>{

            /*
            Si la voz está silenciada o el volumen
            está en cero, continuamos la cola sin hablar.
            */
            if(
                configuracionMultimedia
                    .vozSilenciada
                ||
                configuracionMultimedia
                    .volumenVoz <= 0
            ){

                resolve();
                return;

            }

            const voz =
                new SpeechSynthesisUtterance(
                    texto
                );

            voz.lang =
                "es-MX";

            voz.rate =
                0.92;

            voz.pitch =
                1;

            voz.volume =
                limitarVolumen(
                    configuracionMultimedia
                        .volumenVoz
                    / 100
                );

            voz.onend =
                resolve;

            voz.onerror =
                resolve;

            speechSynthesis.speak(
                voz
            );

        }
    );

}

function esperar(ms){

    return new Promise(resolve => setTimeout(resolve, ms));

}

function actualizarPantallaTurno(data){

    const nombreMesa =
        String(
            data.nombreMesa
            || `Mesa ${data.mesa}`
        ).trim();

    document.getElementById("turno").innerHTML =
        data.codigo;

    document.getElementById("mesa").textContent =
        nombreMesa;

    if(!data.esRellamado){

        lista.unshift(
            `${data.codigo} → ${nombreMesa}`
        );

        if(lista.length > 5){
            lista.pop();
        }

        renderizarListaTurnos();

    }

    const tarjetaTurno =
        document.getElementById("tarjetaTurno");

    const tarjetaMesa =
        document.getElementById("tarjetaMesa");

    tarjetaTurno.classList.remove("resaltar");
    tarjetaMesa.classList.remove("resaltar");

    void tarjetaTurno.offsetWidth;
    void tarjetaMesa.offsetWidth;

    tarjetaTurno.classList.add("resaltar");
    tarjetaMesa.classList.add("resaltar");

    setTimeout(()=>{

        tarjetaTurno.classList.remove("resaltar");
        tarjetaMesa.classList.remove("resaltar");

    }, 1300);

}

function renderizarListaTurnos(){

    document.getElementById(
        "lista"
    ).innerHTML =
        lista.join("<br>");

}

async function cargarUltimosTurnos(){

    try{

        const response =
            await fetch(
                "/api/pantalla/ultimos",
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(
            !response.ok
            || !data.success
        ){

            throw new Error(
                data.mensaje
                || "No se pudieron cargar los últimos turnos"
            );

        }

        lista.length = 0;

        for(
            const turno
            of data.turnos || []
        ){

            const nombreMesa =
                String(
                    turno.nombreMesa
                    || `Mesa ${turno.mesa}`
                ).trim();

            lista.push(
                `${turno.codigo} → ${nombreMesa}`
            );

        }

        renderizarListaTurnos();

        /*
        Mostramos también el turno más reciente
        en las tarjetas principales, pero sin
        reproducir sonido ni voz.
        */
        const ultimo =
            data.turnos?.[0];

        if(ultimo){

            document.getElementById(
                "turno"
            ).textContent =
                ultimo.codigo;

            document.getElementById(
                "mesa"
            ).textContent =
                ultimo.nombreMesa
                || `Mesa ${ultimo.mesa}`;

        }

    }catch(error){

        console.error(
            "Error al recuperar últimos turnos:",
            error
        );

    }

}

async function procesarColaAnuncios(){

    if(anunciando){
        return;
    }

    anunciando = true;

    while(colaAnuncios.length > 0){

        const data = colaAnuncios.shift();

        const nombreMesa =
            String(
                data.nombreMesa
                || `Mesa ${data.mesa}`
            ).trim();

        // El turno cambia solamente cuando empieza su anuncio
        actualizarPantallaTurno(data);

        // Mostrar recuadro y bajar volumen del video
        mostrarOverlayTurno(data);

        if(
            !configuracionMultimedia
                .vozSilenciada
            &&
            configuracionMultimedia
                .volumenVoz > 0
        ){

            sonido.currentTime = 0;

            await sonido
                .play()
                .catch(error => {

                    console.log(
                        "No se pudo reproducir el sonido:",
                        error
                    );

                });

            /*
            Esperamos la duración aproximada del ding.
            */
            await esperar(2200);

        }else{

            /*
            Una pequeña pausa visual cuando la voz
            y el ding están silenciados.
            */
            await esperar(400);

        }

        const tramite =
            String(
                data.nombreTramite
                || data.tramite
                || ""
            ).trim();

        const prefijo =
            obtenerPrefijo(data.codigo);

        const numero =
            obtenerNumeroTurno(data.codigo);

        const tramiteLimpio =
            tramite
                .replace(/^turno\s*/i, "")
                .trim();

        const encabezadoTramite =
            tramiteLimpio
                ? `Turno ${tramiteLimpio}. `
                : "Turno. ";

        await hablar(
            encabezadoTramite +
            `${formatearPrefijo(prefijo)} ${numero}. ` +
            `Favor de pasar a ${nombreMesa}.`
        );

        // Mantener el turno visible 2 segundos más
        await esperar(2000);

        // Ocultar recuadro y recuperar audio del video
        ocultarOverlayTurno();

    }

    anunciando = false;

}

function agregarAnuncio(data){

    colaAnuncios.push(data);

    procesarColaAnuncios();

}

let videos = [];

let videoActual = 0;

let urlVideoActual = null;

const reproductor =
    document.getElementById("videoPublicidad");

const sinVideosPantalla =
    document.getElementById(
        "sinVideosPantalla"
    );


function obtenerUrlVideoActual(){

    if(
        videos.length === 0
        || !videos[videoActual]
    ){

        return null;

    }

    return videos[
        videoActual
    ].url;

}


function mostrarEstadoSinVideos(){

    reproductor.pause();

    reproductor.removeAttribute(
        "src"
    );

    reproductor.load();

    urlVideoActual =
        null;

    sinVideosPantalla
        .classList
        .add("activo");

}


function ocultarEstadoSinVideos(){

    sinVideosPantalla
        .classList
        .remove("activo");

}


function reproducirVideoActual(){

    if(videos.length === 0){

        mostrarEstadoSinVideos();

        return;

    }

    if(
        videoActual < 0
        || videoActual >= videos.length
    ){

        videoActual = 0;

    }

    const url =
        obtenerUrlVideoActual();

    if(!url){

        mostrarEstadoSinVideos();

        return;

    }

    ocultarEstadoSinVideos();

    if(
        reproductor.src
        &&
        urlVideoActual === url
    ){

        aplicarVolumenVideo();

        reproductor
            .play()
            .catch(()=>{});

        return;

    }

    urlVideoActual =
        url;

    reproductor.src =
        url;

    reproductor.load();

    aplicarVolumenVideo();

    reproductor
        .play()
        .catch(error => {

            console.log(
                "La reproducción requiere interacción:",
                error
            );

        });

}


function avanzarVideo(){

    if(videos.length === 0){

        mostrarEstadoSinVideos();

        return;

    }

    videoActual++;

    if(
        videoActual
        >= videos.length
    ){

        videoActual = 0;

    }

    reproducirVideoActual();

}


async function cargarVideosPantalla(
    conservarVideo = true
){

    const urlAnterior =
        conservarVideo
            ? obtenerUrlVideoActual()
            : null;

    try{

        const response =
            await fetch(
                "/api/pantalla/videos",
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(
            !response.ok
            || !data.success
        ){

            throw new Error(
                data.mensaje
                || "No se pudieron cargar los videos"
            );

        }

        videos =
            Array.isArray(
                data.videos
            )
                ? data.videos
                : [];

        if(videos.length === 0){

            videoActual = 0;

            mostrarEstadoSinVideos();

            return;

        }

        if(urlAnterior){

            const indiceAnterior =
                videos.findIndex(
                    video =>
                        video.url
                        === urlAnterior
                );

            videoActual =
                indiceAnterior >= 0
                    ? indiceAnterior
                    : 0;

        }else{

            videoActual = 0;

        }

        reproducirVideoActual();

    }catch(error){

        console.error(
            "Error al cargar videos:",
            error
        );

        /*
        Si ya había una lista válida,
        la mantenemos en reproducción.
        */
        if(videos.length === 0){

            mostrarEstadoSinVideos();

        }

    }

}
    
function limitarVolumen(
    valor
){

    const numero =
        Number(valor);

    if(!Number.isFinite(numero)){

        return 0;

    }

    return Math.max(
        0,
        Math.min(
            1,
            numero
        )
    );

}


function obtenerVolumenVideoNormal(){

    if(
        configuracionMultimedia
            .videoSilenciado
    ){

        return 0;

    }

    return limitarVolumen(
        configuracionMultimedia
            .volumenVideo
        / 100
    );

}


function obtenerVolumenVideoReducido(){

    const volumenNormal =
        obtenerVolumenVideoNormal();

    /*
    Durante el anuncio el video conserva
    aproximadamente 23 % de su volumen normal.

    Ejemplo:
    35 % normal -> cerca de 8 % durante el anuncio.
    */
    return limitarVolumen(
        volumenNormal * 0.23
    );

}


function aplicarVolumenVideo(){

    reproductor.muted =
        configuracionMultimedia
            .videoSilenciado;

    reproductor.volume =
        videoReducidoPorAnuncio
            ? obtenerVolumenVideoReducido()
            : obtenerVolumenVideoNormal();

}


function aplicarVolumenVoz(){

    sonido.muted =
        configuracionMultimedia
            .vozSilenciada;

    sonido.volume =
        configuracionMultimedia
            .vozSilenciada
            ? 0
            : limitarVolumen(
                configuracionMultimedia
                    .volumenVoz
                / 100
            );

}


function aplicarConfiguracionMultimediaPantalla(
    configuracion
){

    configuracionMultimedia = {

        volumenVoz:
            Math.max(
                0,
                Math.min(
                    100,
                    Number(
                        configuracion
                            ?.volumenVoz
                        ?? 100
                    )
                )
            ),

        volumenVideo:
            Math.max(
                0,
                Math.min(
                    100,
                    Number(
                        configuracion
                            ?.volumenVideo
                        ?? 35
                    )
                )
            ),

        vozSilenciada:
            configuracion
                ?.vozSilenciada
            === true,

        videoSilenciado:
            configuracion
                ?.videoSilenciado
            === true

    };

    aplicarVolumenVideo();

    aplicarVolumenVoz();

}


async function cargarConfiguracionMultimediaPantalla(){

    try{

        const response =
            await fetch(
                "/api/pantalla/configuracion-multimedia",
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(
            !response.ok
            || !data.success
        ){

            throw new Error(
                data.mensaje
                || "No se pudo cargar la configuración multimedia"
            );

        }

        aplicarConfiguracionMultimediaPantalla(
            data.configuracion
        );

    }catch(error){

        console.error(
            "Error al cargar configuración multimedia:",
            error
        );

        /*
        Conservamos los valores predeterminados.
        */
        aplicarConfiguracionMultimediaPantalla(
            configuracionMultimedia
        );

    }

}

reproductor.addEventListener(
    "ended",
    ()=>{

        avanzarVideo();

    }
);

reproductor.addEventListener(
    "error",
    ()=>{

        console.error(
            "No se pudo reproducir:",
            obtenerUrlVideoActual()
        );

        /*
        Intentamos continuar con el siguiente.
        */
        setTimeout(
            avanzarVideo,
            1200
        );

    }
);

function mostrarOverlayTurno(data){

    const nombreMesa =
        String(
            data.nombreMesa
            || `Mesa ${data.mesa}`
        ).trim();

    const videoBox =
        document.getElementById("videoBox");

    const overlay =
        document.getElementById("overlayTurno");

    document.getElementById("overlayCodigo").innerHTML =
        data.codigo;

    document.getElementById("overlayMesa").textContent =
        nombreMesa.toUpperCase();

    videoReducidoPorAnuncio = true;

    aplicarVolumenVideo();

    videoBox.classList.add("oscuro");
    overlay.classList.add("activo");

}

function ocultarOverlayTurno(){

    const videoBox =
        document.getElementById("videoBox");

    const overlay =
        document.getElementById("overlayTurno");

    overlay.classList.remove("activo");
    videoBox.classList.remove("oscuro");

    videoReducidoPorAnuncio = false;

    aplicarVolumenVideo();
}

function actualizarReloj(){

    const ahora = new Date();

    document.getElementById("hora").innerHTML =
        ahora.toLocaleTimeString("es-MX", {
            hour:"2-digit",
            minute:"2-digit"
        });

    document.getElementById("fecha").innerHTML =
        ahora.toLocaleDateString("es-MX", {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        });

}

setInterval(actualizarReloj, 1000);
actualizarReloj();

async function iniciarPantalla(){

    await cargarConfiguracionMultimediaPantalla();

    await cargarVideosPantalla(
        false
    );

    await cargarUltimosTurnos();

    aplicarVolumenVideo();

    aplicarVolumenVoz();

    if(videos.length > 0){

        reproductor
            .play()
            .catch(()=>{});

    }

}

iniciarPantalla();

socket.on(
    "configuracionMultimediaActualizada",
    data => {

        if(
            !data
            || !data.configuracion
        ){
            return;
        }

        aplicarConfiguracionMultimediaPantalla(
            data.configuracion
        );

    }
);

socket.on(
    "videosPantallaActualizados",
    ()=>{

        cargarVideosPantalla(
            true
        );

    }
);

socket.on("nuevoTurno", (data)=>{

    agregarAnuncio(data);

});

</script>
